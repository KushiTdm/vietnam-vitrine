<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Web Hà Nội">
  <!--
    Nhà ống — la maison-tube de Hanoi, réduite à quatre traits : toit, corps
    étroit, plancher d'étage, porte cintrée. Redessinée à la main d'après la
    planche `design/planches/_planche-symbole.png` : le PNG généré n'est
    jamais expédié tel quel, un raster de 32 px serait sale sur un onglet.

    Tuile encre pleine plutôt que fond transparent : un tracé sombre sur fond
    transparent disparaît sur une barre d'onglets sombre.
  -->
  <rect width="32" height="32" rx="7" fill="#16140F" />
  <g fill="none" stroke="#F3EDE3" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 13 L16 6.5 L25 13" />
    <path d="M9.5 13 V25.5 H22.5 V13" />
    <path d="M9.5 18.5 H22.5" />
    <path d="M14 25.5 V22 a2 2 0 0 1 4 0 V25.5" />
  </g>
</svg>
